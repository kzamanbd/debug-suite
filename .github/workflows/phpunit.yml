name: 🧪 PHPUnit Test Suite

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  phpunit-tests:
    name: 🧪 PHPUnit Tests (PHP ${{ matrix.php }} | WP ${{ matrix.wordpress }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2']
        wordpress: ['latest']

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐘 Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2
          extensions: mysqli, mbstring, zip, gd, exif, fileinfo
          ini-values: memory_limit=256M

      - name: 📂 Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: 🗄️ Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php${{ matrix.php }}-
            ${{ runner.os }}-composer-
      - name: 🔧 Install Composer Dependencies
        run: |
          echo "🚀 Installing PHP dependencies..."
          composer install --prefer-dist --no-progress
          echo "✅ Dependencies installed successfully"
      - name: 📦 Install System Dependencies
        run: |
          echo "🔧 Installing system packages..."
          sudo apt-get update -qq
          sudo apt-get install -y subversion
          echo "✅ System packages installed"
      - name: 🌐 Setup WordPress Test Environment
        run: |
          echo "🛠️ Setting up WordPress test suite..."
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wordpress }}
          echo "✅ WordPress test environment ready"
      - name: 🧪 Run Unit Tests
        run: |
          echo "🚀 Running unit tests..."
          composer run test:unit
          echo "✅ Unit tests completed"
      - name: 🔧 Run Integration Tests
        run: |
          echo "🚧 Integration tests are currently being set up..."
          echo "📝 TODO: Configure integration test environment"
          echo "⏭️ Skipping integration tests for now"
      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-php${{ matrix.php }}-wp${{ matrix.wordpress }}
          path: |
            tests/coverage/
            tests/reports/
          retention-days: 30

      - name: 🎉 Test Summary
        if: always()
        run: |
          echo "🎯 Test execution completed!"
          echo "PHP Version: ${{ matrix.php }}"
          echo "WordPress Version: ${{ matrix.wordpress }}"
          echo "Check the logs above for detailed results"
