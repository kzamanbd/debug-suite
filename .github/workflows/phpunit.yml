name: PHPUnit Test Suite

on:
  pull_request:
  push:
    branches:
      - develop

concurrency:
  group: phpunit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit-tests:
    name: PHPUnit Tests (PHP ${{ matrix.php }} | WP ${{ matrix.wordpress }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.1"]
        wordpress: ["latest"]

    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🐘 Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: mbstring, zip
          ini-values: memory_limit=256M

      - name: 📂 Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: 🗄️ Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php${{ matrix.php }}-
            ${{ runner.os }}-composer-

      - name: 🔧 Install Composer Dependencies
        run: |
          echo "🚀 Installing PHP dependencies..."
          composer install --prefer-dist --no-progress
          echo "✅ Dependencies installed successfully"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: 🔧 Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🌐 Start wp-env
        run: |
          echo "🛠️ Starting WordPress environment (PHP ${{ matrix.php }})..."
          pnpm env:start
          echo "✅ wp-env is up"

      - name: 🧪 Run Unit Tests
        run: |
          echo "🚀 Running unit tests..."
          pnpm env:test:unit
          echo "✅ Unit tests completed"

      - name: 🔧 Run Integration Tests
        run: |
          echo "🚧 Running integration tests..."
          pnpm env:test:integration
          echo "✅ Integration tests completed"

      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-php${{ matrix.php }}-wp${{ matrix.wordpress }}
          path: |
            tests/coverage/
            tests/reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: 🧹 Stop wp-env
        if: always()
        run: pnpm env:stop || true

      - name: 🎉 Test Summary
        if: always()
        run: |
          echo "🎯 Test execution completed!"
          echo "PHP Version: ${{ matrix.php }}"
          echo "WordPress Version: ${{ matrix.wordpress }}"
          echo "Check the logs above for detailed results"
