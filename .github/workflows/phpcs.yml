on:
  pull_request:
  push:
    branches:
      - develop

name: PHPCS Inspection
jobs:
  runPHPCSInspection:
    name: Run PHPCS inspection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: cs2pr, composer:v2

      # Cache PHP extensions
      - name: Cache PHP extensions
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/php/extensions
          key: ${{ runner.os }}-php-ext-${{ hashFiles('.github/workflows/phpcs.yml') }}

      # Get Composer cache directory
      - name: Get composer cache directory
        id: composercache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      # Cache Composer dependencies
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: "${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: ${{ runner.os }}-composer-

      # Cache PHPCS results
      - name: Cache PHPCS results
        uses: actions/cache@v4
        with:
          path: .phpcs.cache
          key: phpcs-cache-${{ github.sha }}
          restore-keys: |
            phpcs-cache-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - id: changes
        run: |
          URL="https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files"
          FILES=$(curl --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' -s -X GET -G $URL | jq -r '.[] | .filename' | xargs)
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Detect coding standard violations
        run: vendor/bin/phpcs ${{ steps.changes.outputs.files }} -q --report=checkstyle --cache=.phpcs.cache | cs2pr --graceful-warnings
